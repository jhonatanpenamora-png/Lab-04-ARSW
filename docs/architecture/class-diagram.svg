<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850">
    <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#253858"/></marker>
        <marker id="triangle" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto"><path d="M0,0 L0,12 L11,6 z" fill="white" stroke="#253858"/></marker>
        <style>.box{fill:#f7f9fc;stroke:#253858;stroke-width:2}.head{fill:#d9e7ff;stroke:#253858;stroke-width:2}.n{font:700 18px Arial;fill:#172b4d}.t{font:14px monospace;fill:#172b4d}.r{font:13px Arial;fill:#344563}.line{stroke:#253858;stroke-width:2;fill:none;marker-end:url(#arrow)}.impl{stroke:#253858;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#triangle)}</style>
    </defs>
    <rect width="1400" height="850" fill="white"/><text x="700" y="38" text-anchor="middle" class="n" style="font-size:26px">Lab 04 - Main Class Diagram</text>
    <g transform="translate(40,90)"><rect class="box" width="310" height="165"/><rect class="head" width="310" height="42"/><text class="n" x="155" y="27" text-anchor="middle">BoardRestController</text><text class="t" x="12" y="68">- service: BoardApplicationService</text><text class="t" x="12" y="96">+ create(request): ResponseEntity</text><text class="t" x="12" y="122">+ get(boardId): Board</text><text class="t" x="12" y="148">+ replace(boardId, request): Board</text></g>
    <g transform="translate(450,90)"><rect class="box" width="390" height="165"/><rect class="head" width="390" height="42"/><text class="n" x="195" y="27" text-anchor="middle">BoardApplicationService</text><text class="t" x="12" y="68">- repository: BoardRepository</text><text class="t" x="12" y="96">+ createBoard(name): Board</text><text class="t" x="12" y="122">+ getBoard(boardId): Board</text><text class="t" x="12" y="148">+ replaceBoard(boardId, name, elements): Board</text></g>
    <g transform="translate(950,80)"><rect class="box" width="380" height="180"/><rect class="head" width="380" height="55"/><text class="r" x="190" y="18" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text><text class="n" x="190" y="42" text-anchor="middle">BoardRepository</text><text class="t" x="12" y="82">+ save(board): Board</text><text class="t" x="12" y="110">+ findById(boardId): Optional&lt;Board&gt;</text><text class="t" x="12" y="138">+ existsById(boardId): boolean</text></g>
    <g transform="translate(950,350)"><rect class="box" width="380" height="110"/><rect class="head" width="380" height="42"/><text class="n" x="190" y="27" text-anchor="middle">InMemoryBoardRepository</text><text class="t" x="12" y="75">- boards: Map&lt;String, Board&gt;</text></g>
    <g transform="translate(430,500)"><rect class="box" width="300" height="135"/><rect class="head" width="300" height="42"/><text class="n" x="150" y="27" text-anchor="middle">Board</text><text class="t" x="12" y="70">+ id: String</text><text class="t" x="12" y="94">+ name: String</text><text class="t" x="12" y="118">+ elements: List&lt;BoardElement&gt;</text></g>
    <g transform="translate(830,550)"><rect class="box" width="300" height="235"/><rect class="head" width="300" height="42"/><text class="n" x="150" y="27" text-anchor="middle">BoardElement</text><text class="t" x="12" y="68">+ id: String</text><text class="t" x="12" y="92">+ type: ElementType</text><text class="t" x="12" y="116">+ x: double</text><text class="t" x="12" y="140">+ y: double</text><text class="t" x="12" y="164">+ width: double</text><text class="t" x="12" y="188">+ height: double</text><text class="t" x="12" y="212">+ text: String</text></g>
    <g transform="translate(1190,580)"><rect class="box" width="170" height="130"/><rect class="head" width="170" height="55"/><text class="r" x="85" y="18" text-anchor="middle">&lt;&lt;enumeration&gt;&gt;</text><text class="n" x="85" y="42" text-anchor="middle">ElementType</text><text class="t" x="18" y="83">RECTANGLE</text><text class="t" x="18" y="109">TEXT</text></g>
    <path class="line" d="M350 170h100"/><text class="r" x="375" y="158">delegates</text>
    <path class="line" d="M840 170h110"/><text class="r" x="875" y="158">uses</text>
    <path class="impl" d="M1140 350v-90"/><text class="r" x="1150" y="315">implements</text>
    <path class="line" d="M645 255v245"/><text class="r" x="655" y="390">creates / returns</text>
    <path class="line" d="M730 565h100"/><text class="r" x="750" y="550">contains 0..*</text>
    <path class="line" d="M1130 650h60"/><text class="r" x="1140" y="635">type</text>
</svg>
