<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="360" fill="#ffffff"/>

  <!-- Client -->
  <rect x="20" y="150" width="120" height="60" rx="6" fill="#eef2ff" stroke="#4338ca"/>
  <text x="80" y="175" text-anchor="middle" font-weight="bold">HTTP</text>
  <text x="80" y="192" text-anchor="middle">Client</text>

  <!-- Web layer group -->
  <rect x="200" y="40" width="260" height="280" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="330" y="60" text-anchor="middle" fill="#475569">Web layer (infrastructure.web.rest)</text>

  <rect x="230" y="90" width="200" height="70" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="330" y="115" text-anchor="middle" font-weight="bold">BoardRestController</text>
  <text x="330" y="132" text-anchor="middle">REST interface</text>

  <rect x="230" y="220" width="200" height="70" rx="6" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="330" y="245" text-anchor="middle" font-weight="bold">GlobalExceptionHandler</text>
  <text x="330" y="262" text-anchor="middle">uniform ApiError mapping</text>

  <!-- Application layer group -->
  <rect x="500" y="40" width="220" height="280" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="610" y="60" text-anchor="middle" fill="#475569">Application layer</text>

  <rect x="520" y="90" width="180" height="70" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="610" y="112" text-anchor="middle" font-weight="bold">BoardApplicationService</text>
  <text x="610" y="129" text-anchor="middle">create / get / replace</text>
  <text x="610" y="146" text-anchor="middle">use cases</text>

  <rect x="520" y="220" width="180" height="60" rx="6" fill="#fef9c3" stroke="#a16207"/>
  <text x="610" y="245" text-anchor="middle" font-weight="bold">BoardRepository</text>
  <text x="610" y="262" text-anchor="middle">&#171;port&#187;</text>

  <!-- Persistence adapter group -->
  <rect x="760" y="40" width="140" height="280" rx="8" fill="none" stroke="#94a3b8" stroke-dasharray="4 3"/>
  <text x="830" y="60" text-anchor="middle" fill="#475569">Persistence</text>

  <rect x="775" y="150" width="110" height="60" rx="6" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="830" y="172" text-anchor="middle" font-weight="bold" font-size="11">InMemory</text>
  <text x="830" y="187" text-anchor="middle" font-weight="bold" font-size="11">BoardRepository</text>

  <rect x="785" y="260" width="90" height="50" rx="25" fill="#f3f4f6" stroke="#4b5563"/>
  <text x="830" y="288" text-anchor="middle" font-size="11">board map</text>

  <!-- Arrows -->
  <line x1="140" y1="180" x2="228" y2="125" stroke="#333" marker-end="url(#arrow)"/>
  <text x="150" y="150" font-size="11">POST/GET/PUT</text>

  <line x1="330" y1="160" x2="330" y2="220" stroke="#333" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
  <text x="336" y="195" font-size="11">on exception</text>

  <line x1="430" y1="120" x2="518" y2="120" stroke="#333" marker-end="url(#arrow)"/>
  <text x="440" y="112" font-size="11">delegates to</text>

  <line x1="610" y1="160" x2="610" y2="220" stroke="#333" marker-end="url(#arrow)"/>
  <text x="616" y="195" font-size="11">depends on</text>

  <line x1="775" y1="200" x2="702" y2="245" stroke="#333" marker-end="url(#arrow)"/>
  <text x="700" y="215" font-size="11">implements</text>

  <line x1="830" y1="210" x2="830" y2="258" stroke="#333" marker-end="url(#arrow)"/>
  <text x="836" y="238" font-size="11">reads/writes</text>
</svg>
