<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ARSW Collaborative Board</title>
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<header class="app-header">
    <div>
        <p class="eyebrow">ARSW · Laboratorio 5</p>
        <h1>Collaborative Board</h1>
    </div>
    <div id="remoteStatus" class="status status-idle" role="status" aria-live="polite">Idle</div>
</header>

<main class="workspace">
    <section class="panel board-controls" aria-label="Controles del tablero">
        <label>
            <span>Nombre</span>
            <input id="boardName" value="Architecture Board" maxlength="80" autocomplete="off">
        </label>
        <button id="newBoardBtn" class="primary">Nuevo</button>
        <label class="board-id-field">
            <span>Board ID</span>
            <input id="boardId" placeholder="Crea o pega un identificador" autocomplete="off">
        </label>
        <button id="loadBtn">Cargar</button>
        <button id="saveBtn" class="primary">Guardar</button>
        <button id="retryBtn" class="danger" hidden>Reintentar</button>
    </section>

    <section class="panel toolbar" aria-label="Herramientas de edición">
        <button id="addRectBtn">+ Rectángulo</button>
        <button id="addTextBtn">+ Texto</button>
        <button id="connectBtn">Conectar selección</button>
        <button id="deleteBtn" class="danger">Eliminar selección</button>
        <p class="hint">Selecciona y arrastra un elemento para moverlo.</p>
    </section>

    <div id="message" class="message" role="status" aria-live="polite">
        Crea un tablero nuevo o carga uno existente para comenzar.
    </div>

    <section class="canvas-shell" aria-label="Área de trabajo">
        <svg id="boardCanvas" viewBox="0 0 1000 600" tabindex="0"
             aria-label="Lienzo SVG del tablero colaborativo"></svg>
    </section>
</main>

<footer>Persistencia completa mediante REST. La colaboración WebSocket se incorpora en el Lab 6.</footer>
<script type="module" src="/js/app.js"></script>
</body>
</html>
